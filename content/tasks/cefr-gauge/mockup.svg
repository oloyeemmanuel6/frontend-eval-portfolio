  <text x="44" y="392" fill="#3d4c5c" font-family="Source Sans 3, sans-serif" font-size="16">Sample control. Not a learner record.</text>
  <text x="44" y="418" fill="#084e4c" font-family="IBM Plex Mono, monospace" font-size="12">A1 at the left. C2 at the right. Text states the level. Colour is not the only signal.</text>
