  <text x="44" y="84" fill="#102033" font-family="Georgia, serif" font-size="28">CEFR gauge</text>
  <path d="M 160.0 290.0 A 180 180 0 0 1 184.1 200.0 L 232.6 228.0 A 124 124 0 0 0 216.0 290.0 Z" fill="#e4d8c4" stroke="#102033"/>
  <path d="M 184.1 200.0 A 180 180 0 0 1 250.0 134.1 L 278.0 182.6 A 124 124 0 0 0 232.6 228.0 Z" fill="#e4d8c4" stroke="#102033"/>
  <path d="M 250.0 134.1 A 180 180 0 0 1 340.0 110.0 L 340.0 166.0 A 124 124 0 0 0 278.0 182.6 Z" fill="#e4d8c4" stroke="#102033"/>
  <path d="M 340.0 110.0 A 180 180 0 0 1 430.0 134.1 L 402.0 182.6 A 124 124 0 0 0 340.0 166.0 Z" fill="#0c6e6a" stroke="#102033"/>
  <path d="M 430.0 134.1 A 180 180 0 0 1 495.9 200.0 L 447.4 228.0 A 124 124 0 0 0 402.0 182.6 Z" fill="#e4d8c4" stroke="#102033"/>
  <path d="M 495.9 200.0 A 180 180 0 0 1 520.0 290.0 L 464.0 290.0 A 124 124 0 0 0 447.4 228.0 Z" fill="#e4d8c4" stroke="#102033"/>
